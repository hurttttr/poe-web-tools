name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build dist artifacts
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ steps.version.outputs.tag }}
        run: python tools/build_dist.py ${{ steps.version.outputs.version }}

      - name: Rename userscript with version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp dist/poe-web-tools.user.js "dist/poe-web-tools-v${VERSION}.user.js"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # 从 CHANGELOG 抽取当前版本段落
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/changelog_section.md

          cat <<'EOF' > /tmp/release_notes_body.md
          ## PoE Web Tools v${{ steps.version.outputs.version }}

          流放之路网页工具——FilterBlade、poe.ninja 与 PoE Planner 异界天赋树简体中文汉化 + 站点快捷跳转。

          ### 🆕 本次更新

          __CHANGELOG__

          ---

          ### 📦 安装方式

          #### 方式 A：油猴脚本（最省事）

          1. 浏览器安装 [Tampermonkey](https://www.tampermonkey.net/) 或 [Violentmonkey](https://violentmonkey.github.io/)；
          2. 下载 Release 附件中的 **`poe-web-tools-v${{ steps.version.outputs.version }}.user.js`**，拖入扩展管理页面（或复制内容新建脚本）；
          3. 访问 [filterblade.xyz](https://www.filterblade.xyz/?game=Poe1)、[poe.ninja](https://poe.ninja/) 或 [poeplanner.com/atlas-tree](https://poeplanner.com/atlas-tree)，右下角出现「汉」按钮即生效。

          > 脚本完全自包含（词典内联），不联网、不依赖任何外部库。

          #### 方式 B：Chrome / Edge 扩展（推荐，带站点跳转弹窗）

          1. 下载 Release 附件中的 **`poe-web-tools-v${{ steps.version.outputs.version }}-extension.zip`** 并解压；
          2. 打开 `chrome://extensions`（Edge 为 `edge://extensions`），开启右上角「**开发者模式**」；
          3. 点击「**加载已解压的扩展程序**」，选择解压后的文件夹；
          4. 把扩展固定到工具栏，点击图标即可在 FilterBlade / poe.ninja / PoE Planner 之间跳转，并开关汉化、切换模式。

          ---

          ### ✨ 功能一览

          | 功能 | 说明 |
          |------|------|
          | 简体中文汉化 | FilterBlade 界面、规则名、FAQ 标题、poe.ninja 物价表 / 流派页、PoE Planner 异界天赋树全面汉化 |
          | 中文 / 双语 / 原文 切换 | 面板或扩展弹窗切换；`Alt+Z` 快速在中文 ↔ 原文间切换 |
          | 站点快捷跳转 | 扩展弹窗卡片点击，在 FilterBlade / poe.ninja / PoE Planner 间一键切换 |
          | 中英对照查询 | 面板输入中文或英文，列出对照，点击复制英文名 |
          | 物品词缀翻译 | 带数值占位（`#`）的 7830 条词缀模板，运行时自动回填实际数值 |
          | 天赋 / 专精 / 符文嫁接说明 | poe.ninja 流派页天赋提示框完整汉化 |
          | 异界天赋树汉化 | 352 个天赋名 + 338 条天赋说明（数值自动回填）+ 界面文案，悬浮提示内完整中文化 |
          | 统计栏 / 汇总行 | 站点把数值包进 `<span>` 再 `v-html` 渲染，按「整行」拼合翻译，数值高亮保留 |
          | 中文搜索天赋树 | 搜索框直接输入中文（「毁灭游戏」「跳跃点」「裂隙」…），自动反查成英文节点名交给站点高亮 |
          | 交互还原 | 点击交互元素瞬间自动还原英文，站点逻辑不受影响 |
          | 导出未译文本 | 导出当前页面仍是英文的文本清单（JSON），用来补词典 |

          **词典规模**：__DICT_STATS__，来源：编年史 · 官方交易站词缀 · poe.ninja 官方繁中转简 · 社区底稿 · 人工校对

          ---

          ### 📋 Release 附件说明

          | 文件 | 说明 |
          |------|------|
          | `poe-web-tools-v${{ steps.version.outputs.version }}.user.js` | 油猴脚本（词典内联，可直接安装） |
          | `poe-web-tools-v${{ steps.version.outputs.version }}-extension.zip` | Chrome / Edge 扩展压缩包（解压后加载） |

          ---

          ### ⚠️ 注意事项

          - 扩展以**开发者模式**加载，属于本地扩展，不会上架 Chrome Web Store，每次启动浏览器可能提示「停用开发者模式扩展」，点「取消」忽略即可；
          - 若文件夹路径改变，需在扩展页面重新「加载已解压的扩展程序」；
          - PoE Planner 的天赋树本体是 canvas / WebGL，节点名与说明只在**悬浮提示**里汉化；右侧统计栏与左下角搜索框已支持中文（搜索会反查成英文节点名，中文词无法在说明内部做局部高亮）；
          - 本工具不收集任何数据，无需任何权限（扩展仅需 `activeTab` 用于弹窗读取当前标签）。
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          body = Path('/tmp/release_notes_body.md').read_text(encoding='utf-8')
          section = Path('/tmp/changelog_section.md').read_text(encoding='utf-8').strip()
          if not section:
              section = '本次发布以稳定性与文档为主，详见仓库 CHANGELOG.md。'
          body = body.replace('__CHANGELOG__', section)

          # 词典规模从构建产物动态读取，避免每版手改 Release 模板。
          meta = json.loads(Path('data/dictionary.meta.json').read_text(encoding='utf-8'))
          atlas = meta.get('atlas', {})
          stats = (
              f"主词典 {meta['entries']:,} 条"
              f" + poeplanner 站点专属 {atlas.get('terms', 0)} 条整句"
              f" / {atlas.get('templates', 0)} 条数值模板"
              f" / {atlas.get('search_nodes', 0)} 个节点的中文搜索索引"
          )
          body = body.replace('__DICT_STATS__', stats)
          Path('/tmp/release_notes.md').write_text(body, encoding='utf-8')
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PoE Web Tools v${{ steps.version.outputs.version }}"
          body_path: /tmp/release_notes.md
          files: |
            dist/poe-web-tools-v${{ steps.version.outputs.version }}.user.js
            dist/poe-web-tools-v${{ steps.version.outputs.version }}-extension.zip
          draft: false
          prerelease: false
